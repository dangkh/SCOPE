book:
  local: |
    You will serve as an assistant to help me determine which types of books a specific user is likely to enjoy.
    I will provide you with information about books that the user has purchased.
    Here are the instructions:
      1. Each purchased book will be described in JSON format, with the following attributes:
      {{
          "title": "the name of the book", (if there is no title, I will set this value to "None" or "nan")
          "description": "a description of book",
      }}

      2. The information I will give you:
      PURCHASED ITEMS: a list of JSON strings describing the items that the user has purchased.

    Requirements:
      1. Please provide information of user in JSON format, following this structure:
      {{
          "summarization": "A summarization of what types of books this user is likely to enjoy" 
          "reasoning": "briefly explain your reasoning for the summarization"
      }}
      2. Please ensure that the "summarization" is no longer than 150 words.
      3. The "reasoning" has no word limits.
      4. Do not provided any other text outside the JSON string.
  global: |
    You will serve as an assistant to analyze collective reading behaviors from random users and a target user.

    Your goal is NOT to infer the target user’s true personal preferences.
    Instead, your task is to identify widely exposed or commonly consumed books that the target user has purchased, which may reflect newly popular books, viral recommendations, bestseller exposure rather than the target user's intrinsic long-term preferences,

    Each purchased book will be described in JSON format, with the following attributes:
    {{
          "title": "the name of the book", (if there is no title, I will set this value to "None" or "nan")
    }}

    I will provide information about books purchased by user.
    Requirements:
      1. Please provide information of user proxy-global interest in JSON format, following this structure:
      {{
          "widely_exposed_interests": "indicates books that appear frequently due to collective popularity, viral exposure, or trending attention in the user's interaction history, but may not represent the user's actual long-term preferences."
          "reasoning": "briefly explain your reasoning."
      }}
      2. Please ensure that the "widely_exposed_interests" is concise, contain book titles and no longer than 150 words.
      3. The "reasoning" is no longer than 250 words.
      4. Do not provided any other text outside the JSON string.

yelp:
  user: |
    You will serve as an assistant to help me determine which types of business a specific user is likely to enjoy.
    I will provide you with information about businesses that the user has visited.
    Here are the instructions:
    1. Each visited business will be described in JSON format, with the following attributes:
    {
        "title": "the name of the business", (if there is no business, I will set this value to "None")
        "description": "a description of what types of users will like this business",
    }

    2. The information I will give you:
    VISITED BUSINESSES: a list of JSON strings describing the businesses that the user has visited.

    Requirements:
    1. Please provide your answer in JSON format, following this structure:
    {
        "summarization": "A summarization of what types of business this user is likely to enjoy" (if you are unable to summarize it, please set this value to "None")
        "reasoning": "briefly explain your reasoning for the summarization"
    }
    2. Please ensure that the "summarization" is no longer than 150 words.
    3. The "reasoning" has no word limits.
    4. Do not provide any other text outside the JSON string.


